# 文件说明：该部分是我们的创新点实验的配置文件    

MODEL:
  PRETRAIN_PATH_T: '/home/zubuntu/workspace/yzy/MambaPro/pths/ViT-B-16.pt' # 预训练权重
  TRANSFORMER_TYPE: 'ViT-B-16' # 骨干类型
  STRIDE_SIZE: [ 16, 16 ] # 步长
  SIE_CAMERA: True # 是否使用相机嵌入
  SIE_VIEW: False # 是否使用视角嵌入
  DIRECT: 1 # 直接
  SIE_COE: 1.0 # 相机嵌入系数
  ID_LOSS_WEIGHT: 0.25 # 分类损失权重
  ID_LOSS_TYPE: 'softmax' # 分类损失类型
  TRIPLET_LOSS_WEIGHT: 1.0 # 三元组损失权重
  PROMPT: True # 是否使用提示
  ADAPTER: True # 是否使用适配器
  MAMBA: True # 是否使用Mamba
  MAMBA_BI: False # Mamba偏置参数
  MAMBA_DT_RANK: 16 # Mamba时间步长秩
  MAMBA_D_STATE: 16 # Mamba状态维度
  FROZEN: True # 是否冻结
  FLOPS_TEST: False # FLOPs测试标志
  NECK: 'bnneck' # 颈部网络类型
  FEAT_DIM: 512 # 特征维度
  
  # ========== 模型测试配置 ==========
  DEVICE_ID: 0                  # 设备ID
  DIST_TRAIN: False             # 分布式训练标志
  DROP_PATH: 0.1                # DropPath比例
  DROP_OUT: 0.1                 # Dropout比例
  ATT_DROP_RATE: 0.0            # 注意力Dropout比例
  DROP_RATE: 0.0                # 通用Dropout比例
  
  # ========== 多尺度滑动窗口配置：启用多尺度特征提取 ==========
  USE_CLIP_MULTI_SCALE: True   # 启用CLIP多尺度滑动窗口特征提取
  CLIP_MULTI_SCALE_SCALES: [4, 8, 16]  # 滑动窗口尺度（4x4小窗口，8x8中窗口，16x16大窗口）
  
  # ========== MoE配置：启用多尺度MoE特征融合模块 ==========
  USE_MULTI_SCALE_MOE: True    # 启用多尺度MoE特征融合模块
  MOE_SCALES: [4, 8, 16]       # MoE滑动窗口尺度（与多尺度滑动窗口保持一致）
  
  # ========== 门控融合配置：默认禁用，使用传统MLP融合 ==========
  USE_GATE_FUSION: False       # 默认禁用门控融合机制（使用传统MLP融合）
  GATE_NUM_HEADS: 8            # 门控网络头数（默认值，不使用）
  GATE_DROPOUT: 0.1            # 门控网络Dropout比例（默认值，不使用）
  
  # ========== 最优MoE参数：基于经验的精心调优组合 ==========
  # 🏆 专家网络隐藏层维度：1024维
  MOE_EXPERT_HIDDEN_DIM: 1024   # 🏆 MoE专家网络隐藏层维度（1024维）
  
  # 🏆 门控网络温度参数：0.7
  MOE_TEMPERATURE: 0.7          # 🏆 MoE门控网络温度参数（0.7）
  
  # 🏆 专家网络Dropout：0.1
  MOE_EXPERT_DROPOUT: 0.1       # 🏆 专家网络Dropout比例（0.1）
  
  # 🏆 门控网络Dropout：0.1
  MOE_GATE_DROPOUT: 0.1         # 🏆 门控网络Dropout比例（0.1）
  
  # 🏆 专家网络层数：2层
  MOE_EXPERT_LAYERS: 2          # 🏆 专家网络层数（2层）
  
  # 🏆 门控网络层数：2层
  MOE_GATE_LAYERS: 2            # 🏆 门控网络层数（2层）
  
  # 🏆 专家激活阈值：0.1
  MOE_EXPERT_THRESHOLD: 0.1     # 🏆 专家激活阈值（0.1）
  
  # 🏆 残差连接权重：1.0
  MOE_RESIDUAL_WEIGHT: 1.0      # 🏆 残差连接权重（1.0）
  

INPUT:
  SIZE_TRAIN: [ 256, 128 ] # 训练尺寸
  SIZE_TEST: [ 256, 128 ] # 测试尺寸
  PROB: 0.5 # random horizontal flip # 随机水平翻转
  RE_PROB: 0.5 # random erasing # 随机擦除
  PADDING: 10 # 填充

DATALOADER:
  SAMPLER: 'softmax_triplet' # 采样器
  NUM_INSTANCE: 4 # 每个批次实例数
  NUM_WORKERS: 8 # 工作线程数

DATASETS:
  NAMES: ('RGBNT201') # 数据集名称
  ROOT_DIR: '/home/zubuntu/workspace/yzy/MambaPro/data/' # 数据集根目录

SOLVER:
  BASE_LR: 0.00035
  WARMUP_ITERS: 10
  MAX_EPOCHS: 60
  OPTIMIZER_NAME: 'Adam'
  GAMMA: 0.1
  IMS_PER_BATCH: 64
  
  # ========== MoE损失权重：基于经验的精心调优 ==========
  # 🏆 专家平衡损失权重：0.001
  MOE_BALANCE_LOSS_WEIGHT: 0.001 # 🔧 MoE专家平衡损失权重（调优：从0.01降低到0.001，减少对主要任务干扰）
  
  # 🏆 稀疏性损失权重：0.0001
  MOE_SPARSITY_LOSS_WEIGHT: 0.0001 # 🔧 MoE稀疏性损失权重（调优：从0.001降低到0.0001，减少训练不稳定）
  
  # 🏆 多样性损失权重：0.001
  MOE_DIVERSITY_LOSS_WEIGHT: 0.001 # 🔧 MoE多样性损失权重（调优：从0.01降低到0.001，减少专家分工过度严格）

TEST:
  IMS_PER_BATCH: 64 # 每个批次图像数 (测试时可以更大)
  RE_RANKING: 'no' # 是否重新排序
  WEIGHT: '/home/zubuntu/workspace/yzy/MambaPro/pths/MambaProbest.pth' # 权重路径
  NECK_FEAT: 'before' # 颈部特征
  FEAT_NORM: 'yes' # 特征归一化
  MISS: "nothing" # 缺失

OUTPUT_DIR: '/home/zubuntu/workspace/yzy/MambaPro/outputs/jzb_base_optimize'

