MODEL:
  CLIP_MULTI_SCALE_SCALES: [4,8,16]
  MOE_SCALES: [4,8,16]
  MOE_EXPERT_THRESHOLD: 0.1
  MOE_EXPERT_DROPOUT: 0.1
  MOE_EXPERT_LAYERS: 2
  MOE_EXPERT_HIDDEN_DIM: 1024
  MOE_TEMPERATURE: 0.7
  PRETRAIN_PATH_T: '/home/zubuntu/workspace/yzy/MambaPro/pths/ViT-B-16.pt' # 预训练权重
  TRANSFORMER_TYPE: 'ViT-B-16' # 骨干类型
  STRIDE_SIZE: [ 16, 16 ] # 步长
  SIE_CAMERA: True # 是否使用相机嵌入
  SIE_VIEW: False # 是否使用视角嵌入
  DIRECT: 1 # 直接
  SIE_COE: 1.0 # 相机嵌入系数
  ID_LOSS_WEIGHT: 0.25 # 分类损失权重
  ID_LOSS_TYPE: 'softmax' # 分类损失类型
  TRIPLET_LOSS_WEIGHT: 1.0 # 三元组损失权重
  PROMPT: True # 是否使用提示
  ADAPTER: True # 是否使用适配器
  MAMBA: True # 是否使用Mamba
  MAMBA_BI: 0.0 # Mamba偏置参数
  MAMBA_DT_RANK: 16 # Mamba时间步长秩
  MAMBA_D_STATE: 16 # Mamba状态维度
  FROZEN: True # 是否冻结
  FLOPS_TEST: False # FLOPs测试标志
  NECK: 'bnneck' # 颈部网络类型
  FEAT_DIM: 512 # 特征维度
  
  # ========== 原始CLIP配置（不加多尺度滑动窗口）==========
  # 功能：使用原始CLIP分支，不添加多尺度滑动窗口处理
  # 用途：作为baseline对比实验
  USE_CLIP_MULTI_SCALE: False   # 禁用CLIP多尺度滑动窗口特征提取
  
  # ========== MoE相关参数 ==========
  USE_GATE_FUSION: False
  MOE_GATE_DROPOUT: 0.1         # MoE门控dropout
  MOE_GATE_LAYERS: 2            # MoE门控层数
  MOE_RESIDUAL_WEIGHT: 1.0      # MoE残差权重
  USE_MULTI_SCALE_MOE: False    # 是否使用多尺度MoE

INPUT:
  SIZE_TRAIN: [ 256, 128 ] # 训练尺寸
  SIZE_TEST: [ 256, 128 ] # 测试尺寸
  PROB: 0.5 # random horizontal flip # 随机水平翻转
  RE_PROB: 0.5 # random erasing # 随机擦除
  PADDING: 10 # 填充

DATALOADER:
  SAMPLER: 'softmax_triplet' # 采样器
  NUM_INSTANCE: 8 # 每个批次实例数 (提高采样多样性)
  NUM_WORKERS: 8 # 工作线程数

DATASETS:
  NAMES: ('RGBNT201') # 数据集名称
  ROOT_DIR: '/home/zubuntu/workspace/yzy/MambaPro/data/' # 数据集根目录

SOLVER:
  # 优化器设置
  OPTIMIZER_NAME: 'Adam' # 优化器名称
  BASE_LR: 0.0005
  WEIGHT_DECAY: 0.0005 # 权重衰减
  WEIGHT_DECAY_BIAS: 0.0005 # 偏置权重衰减
  MOMENTUM: 0.9 # 动量
  
  # 训练设置
  MAX_EPOCHS: 60 # 最大迭代数 (论文标准设置)
  IMS_PER_BATCH: 32 # 每个批次图像数 (提高训练稳定性)
  WARMUP_ITERS: 20 # 预热迭代数 (充分预热)
  WARMUP_METHOD: 'linear' # 预热方法
  WARMUP_FACTOR: 0.01 # 预热因子
  
  # 损失函数设置
  MARGIN: 0.3 # 三元组损失边界
  CENTER_LOSS_WEIGHT: 0.0005 # 中心损失权重
  CENTER_LR: 0.5 # 中心学习率
  
  # 学习率调度
  GAMMA: 0.1 # 衰减率
  STEPS: (30, 50) # 学习率衰减步数
  
  # 其他设置
  SEED: 42 # 随机种子 (确保可复现性)
  CHECKPOINT_PERIOD: 10 # 检查点保存周期
  LOG_PERIOD: 10 # 日志打印周期
  EVAL_PERIOD: 5 # 验证周期
  
  # ========== MoE损失函数参数 ==========
  MOE_BALANCE_LOSS_WEIGHT: 0.005
  MOE_SPARSITY_LOSS_WEIGHT: 0.0001   # MoE稀疏性损失权重
  MOE_DIVERSITY_LOSS_WEIGHT: 0.001   # MoE多样性损失权重

TEST:
  IMS_PER_BATCH: 64 # 每个批次图像数 (测试时可以更大)
  RE_RANKING: 'no' # 是否重新排序
  WEIGHT: '/home/zubuntu/workspace/yzy/MambaPro/pths/MambaProbest.pth' # 权重路径
  NECK_FEAT: 'after' # 颈部特征 (使用after获得更好性能)
  FEAT_NORM: 'yes' # 特征归一化
  MISS: "nothing" # 缺失

# ========== 原始CLIP实验输出目录 ==========
# 功能：将原始CLIP实验结果保存到专门的目录，便于对比分析
OUTPUT_DIR: 'results/everyExperiments/experiment_20251016_110818/logs'