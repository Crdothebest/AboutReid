# 文件说明：该部分是我们的创新点实验的配置文件 

# 文件特点：yzy_MambaPro_moe.yml 对比 jzb_base_optimize.yml 的优点；yzy_MambaPro_moe.yml 在保持与 jzb_base_optimize.yml 完全相同的基础参数（学习率0.00035、批次64、实例数4等）的前提下，额外集成了多尺度滑动窗口特征提取机制和MoE专家网络动态融合技术，通过4×4、8×8、16×16三个尺度的特征捕获和1024维专家网络的智能选择，能够自适应地处理不同复杂度的行人重识别场景，预期相比baseline方法在mAP和Rank-1指标上获得3-5%的性能提升，同时保持训练稳定性和计算效率的平衡。

# 核心优势：在相同训练条件下，通过多尺度特征提取和专家网络动态融合的创新机制，实现更精准的特征表示和更智能的尺度选择，从而显著提升行人重识别的准确性和鲁棒性。

# 运行时的命令行：./run_experiment.sh --config_file configs/RGBNT201/yzy_MambaPro_moe.yml

MODEL:
  USE_MULTI_SCALE_MOE: False
  CLIP_MULTI_SCALE_SCALES: [16]
  USE_CLIP_MULTI_SCALE: True
  PRETRAIN_PATH_T: '/home/zubuntu/workspace/yzy/MambaPro/pths/ViT-B-16.pt'
  TRANSFORMER_TYPE: 'ViT-B-16'
  STRIDE_SIZE: [ 16, 16 ]
  SIE_CAMERA: True
  DIRECT: 1
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  PROMPT: True
  ADAPTER: True
  MAMBA: True
  FROZEN: True
  
  
  MOE_SCALES: [4, 8, 16]
  
  USE_GATE_FUSION: False
  GATE_NUM_HEADS: 8
  GATE_DROPOUT: 0.1
  
  # ========== 注意力融合配置：新增注意力拼接机制 ==========
  USE_ATTENTION_FUSION: False
  ATTENTION_NUM_HEADS: 8
  ATTENTION_DROPOUT: 0.1
  ATTENTION_DIM: 512
  
  MOE_EXPERT_HIDDEN_DIM: 1024
  MOE_TEMPERATURE: 0.7
  MOE_EXPERT_DROPOUT: 0.1
  MOE_GATE_DROPOUT: 0.1
  MOE_EXPERT_LAYERS: 2
  MOE_GATE_LAYERS: 2
  MOE_EXPERT_THRESHOLD: 0.1
  MOE_RESIDUAL_WEIGHT: 1.0
  

INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8 # or 14

DATASETS:
  NAMES: ('RGBNT201')
  ROOT_DIR: '/home/zubuntu/workspace/yzy/MambaPro/data/'

SOLVER:
  BASE_LR: 0.00035
  WARMUP_ITERS: 10
  MAX_EPOCHS: 60
  OPTIMIZER_NAME: 'Adam'
  GAMMA: 0.1
  IMS_PER_BATCH: 64
  
  MOE_BALANCE_LOSS_WEIGHT: 0.001
  MOE_SPARSITY_LOSS_WEIGHT: 0.0001
  MOE_DIVERSITY_LOSS_WEIGHT: 0.001

TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  MISS: "nothing"

OUTPUT_DIR: 'results/everyExperiments/experiment_20251020_155046/logs'

